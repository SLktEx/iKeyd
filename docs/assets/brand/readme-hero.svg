<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720" role="img" aria-labelledby="title desc">
  <title id="title">iKeyd — Your keyboard, your workflow.</title>
  <desc id="desc">Dark developer-tool artwork with a keyboard, code panel, layers, combos and cyan accents.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B0F14"/><stop offset="1" stop-color="#0E1822"/></linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7AF5F4"/><stop offset="1" stop-color="#1CC6EA"/></linearGradient>
    <radialGradient id="glow"><stop offset="0" stop-color="#29DCF4" stop-opacity=".24"/><stop offset="1" stop-color="#29DCF4" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse"><path d="M64 0H0V64" fill="none" stroke="#27485B" stroke-opacity=".16"/></pattern>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="26"/></filter>
  </defs>
  <rect width="1600" height="720" fill="url(#bg)"/>
  <rect width="1600" height="720" fill="url(#grid)"/>
  <circle cx="1270" cy="160" r="430" fill="url(#glow)"/>
  <circle cx="940" cy="590" r="250" fill="#1CC6EA" opacity=".05" filter="url(#soft)"/>

  <g font-family="Inter, system-ui, sans-serif">
    <text x="92" y="128" fill="#E5E7EB" font-size="72" font-weight="700">iKeyd</text>
    <text x="94" y="176" fill="#55E6F3" font-size="28" font-weight="500">I keyed it my way.</text>
    <rect x="94" y="207" width="126" height="5" rx="2.5" fill="url(#cyan)"/>

    <text x="92" y="314" fill="#E5E7EB" font-size="52" font-weight="650">Your keyboard, your workflow.</text>
    <text x="94" y="365" fill="#B9CAD5" font-size="28">キーの可能性を、もう一度設計する。</text>
    <text x="94" y="416" fill="#7E8FA0" font-size="22">Remap keys. Build layers. Compose combos. Keep your hands in flow.</text>

    <g font-size="17" font-weight="550" fill="#B8D6E2">
      <g><rect x="94" y="486" width="152" height="45" rx="22" fill="#10232F" stroke="#2B5D74"/><text x="118" y="515">Windows first</text></g>
      <g><rect x="260" y="486" width="132" height="45" rx="22" fill="#10232F" stroke="#2B5D74"/><text x="283" y="515">iKeyd DSL</text></g>
      <g><rect x="406" y="486" width="106" height="45" rx="22" fill="#10232F" stroke="#2B5D74"/><text x="432" y="515">Layers</text></g>
      <g><rect x="526" y="486" width="110" height="45" rx="22" fill="#10232F" stroke="#2B5D74"/><text x="551" y="515">Combos</text></g>
      <g><rect x="650" y="486" width="102" height="45" rx="22" fill="#10232F" stroke="#2B5D74"/><text x="677" y="515">Mouse</text></g>
    </g>
    <text x="94" y="630" fill="#6F91A2" font-size="15" letter-spacing="2.1">OPEN SOURCE  ·  CUSTOMIZE  ·  MAKE IT YOURS</text>
  </g>

  <g transform="translate(835 77)">
    <rect x="132" y="0" width="505" height="296" rx="26" fill="#101A24" stroke="#315A70" stroke-width="2"/>
    <rect x="155" y="24" width="459" height="244" rx="14" fill="#0A1219"/>
    <circle cx="178" cy="47" r="6" fill="#FF675C"/><circle cx="198" cy="47" r="6" fill="#F6C34A"/><circle cx="218" cy="47" r="6" fill="#55CF7A"/>
    <g fill="#79EAF3" opacity=".92">
      <rect x="183" y="88" width="130" height="10" rx="5"/><rect x="183" y="118" width="214" height="10" rx="5" opacity=".72"/><rect x="210" y="148" width="168" height="10" rx="5" opacity=".58"/><rect x="210" y="178" width="238" height="10" rx="5" opacity=".76"/><rect x="183" y="208" width="98" height="10" rx="5" opacity=".62"/>
    </g>
    <g fill="#5E7180"><rect x="456" y="88" width="117" height="8" rx="4"/><rect x="456" y="118" width="92" height="8" rx="4"/><rect x="456" y="148" width="126" height="8" rx="4"/></g>

    <g transform="translate(10 290) rotate(-5 330 120)">
      <path d="M44 32L598 0L676 185L100 231Z" fill="#0E1720" stroke="#33566A" stroke-width="2"/>
      <g fill="#132432" stroke="#2B5266" stroke-width="1.4">
        <rect x="76" y="55" width="52" height="44" rx="8"/><rect x="139" y="50" width="52" height="44" rx="8"/><rect x="202" y="45" width="52" height="44" rx="8"/><rect x="265" y="40" width="52" height="44" rx="8"/><rect x="328" y="35" width="52" height="44" rx="8"/><rect x="391" y="30" width="52" height="44" rx="8"/><rect x="454" y="25" width="52" height="44" rx="8"/><rect x="517" y="20" width="52" height="44" rx="8"/>
        <rect x="91" y="113" width="52" height="44" rx="8"/><rect x="154" y="108" width="52" height="44" rx="8"/><rect x="217" y="103" width="52" height="44" rx="8"/><rect x="280" y="98" width="52" height="44" rx="8"/><rect x="343" y="93" width="52" height="44" rx="8"/><rect x="406" y="88" width="52" height="44" rx="8"/><rect x="469" y="83" width="52" height="44" rx="8"/><rect x="532" y="78" width="52" height="44" rx="8"/>
        <rect x="111" y="171" width="52" height="38" rx="8"/><rect x="174" y="166" width="52" height="38" rx="8"/><rect x="237" y="161" width="52" height="38" rx="8"/><rect x="300" y="156" width="52" height="38" rx="8"/><rect x="363" y="151" width="52" height="38" rx="8"/><rect x="426" y="146" width="52" height="38" rx="8"/><rect x="489" y="141" width="88" height="38" rx="8"/>
      </g>
      <g fill="url(#cyan)" opacity=".9"><rect x="265" y="40" width="52" height="44" rx="8"/><rect x="343" y="93" width="52" height="44" rx="8"/><rect x="426" y="146" width="52" height="38" rx="8"/></g>
    </g>

    <g transform="translate(573 326)">
      <rect width="176" height="92" rx="18" fill="#10232F" stroke="#2F6E88"/>
      <path d="M28 30H69M28 45H52M28 60H81" stroke="#5BE7F3" stroke-width="5" stroke-linecap="round"/>
      <path d="M112 30l18 15-18 15M130 45h22" fill="none" stroke="#5BE7F3" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
</svg>
