<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="650" viewBox="0 0 1600 650" role="img" aria-labelledby="title desc">
  <title id="title">iKeyd feature overview</title>
  <desc id="desc">Five dark feature cards for keyboard remapping, layers and combos, mouse, clipboard and commands.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B0F14"/><stop offset="1" stop-color="#0D1720"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#78F4F3"/><stop offset="1" stop-color="#1DC9EA"/></linearGradient>
    <pattern id="grid" width="58" height="58" patternUnits="userSpaceOnUse"><path d="M58 0H0V58" fill="none" stroke="#27485B" stroke-opacity=".13"/></pattern>
  </defs>
  <rect width="1600" height="650" fill="url(#bg)"/>
  <rect width="1600" height="650" fill="url(#grid)"/>
  <circle cx="1460" cy="70" r="360" fill="#22D7EE" opacity=".05"/>
  <g font-family="Inter, system-ui, sans-serif">
    <text x="76" y="94" fill="#E5E7EB" font-size="54" font-weight="700">Everything under your fingers.</text>
    <text x="78" y="139" fill="#B9CAD5" font-size="25">キー入力から、作業の流れまで。</text>
    <text x="78" y="183" fill="#7E8FA0" font-size="20">One programmable input layer for the parts of your workflow you touch all day.</text>
  </g>

  <g transform="translate(76 248)" font-family="Inter, system-ui, sans-serif">
    <g>
      <rect width="276" height="310" rx="24" fill="#0F1B25" stroke="#28495C"/>
      <rect x="22" y="22" width="82" height="5" rx="2.5" fill="url(#accent)"/>
      <g transform="translate(25 58)" fill="#173442" stroke="#58DDEA" stroke-width="1.6">
        <rect width="16" height="13" rx="3"/><rect x="22" width="16" height="13" rx="3"/><rect x="44" width="16" height="13" rx="3"/><rect x="66" width="16" height="13" rx="3"/>
        <rect y="19" width="16" height="13" rx="3"/><rect x="22" y="19" width="16" height="13" rx="3"/><rect x="44" y="19" width="16" height="13" rx="3"/><rect x="66" y="19" width="16" height="13" rx="3"/>
        <rect y="38" width="16" height="13" rx="3"/><rect x="22" y="38" width="16" height="13" rx="3"/><rect x="44" y="38" width="16" height="13" rx="3"/><rect x="66" y="38" width="16" height="13" rx="3"/>
      </g>
      <text x="24" y="146" fill="#E5E7EB" font-size="25" font-weight="650">Keyboard</text>
      <text x="24" y="183" fill="#8193A2" font-size="16"><tspan x="24" dy="0">Remap ordinary keys into the</tspan><tspan x="24" dy="25">layout you actually want.</tspan></text>
      <text x="24" y="278" fill="#55E5F1" font-size="30">→</text>
    </g>

    <g transform="translate(294 0)">
      <rect width="276" height="310" rx="24" fill="#0F1B25" stroke="#28495C"/>
      <rect x="22" y="22" width="82" height="5" rx="2.5" fill="url(#accent)"/>
      <g transform="translate(24 58)" fill="#15313E" stroke="#58DDEA" stroke-width="1.6"><path d="M0 18L38 0l38 18-38 18z"/><path d="M0 33l38 18 38-18" fill="none"/><path d="M0 48l38 18 38-18" fill="none"/></g>
      <text x="24" y="146" fill="#E5E7EB" font-size="25" font-weight="650">Layers &amp; Combos</text>
      <text x="24" y="183" fill="#8193A2" font-size="16"><tspan x="24" dy="0">Compose dense behavior</tspan><tspan x="24" dy="25">without adding physical keys.</tspan></text>
      <text x="24" y="278" fill="#55E5F1" font-size="30">→</text>
    </g>

    <g transform="translate(588 0)">
      <rect width="276" height="310" rx="24" fill="#0F1B25" stroke="#28495C"/>
      <rect x="22" y="22" width="82" height="5" rx="2.5" fill="url(#accent)"/>
      <g transform="translate(45 50)"><rect width="40" height="68" rx="20" fill="#132E3B" stroke="#58DDEA" stroke-width="2.5"/><line x1="20" y1="8" x2="20" y2="27" stroke="#58DDEA" stroke-width="3" stroke-linecap="round"/></g>
      <text x="24" y="146" fill="#E5E7EB" font-size="25" font-weight="650">Mouse</text>
      <text x="24" y="183" fill="#8193A2" font-size="16"><tspan x="24" dy="0">Move, click and scroll without</tspan><tspan x="24" dy="25">leaving the keyboard.</tspan></text>
      <text x="24" y="278" fill="#55E5F1" font-size="30">→</text>
    </g>

    <g transform="translate(882 0)">
      <rect width="276" height="310" rx="24" fill="#0F1B25" stroke="#28495C"/>
      <rect x="22" y="22" width="82" height="5" rx="2.5" fill="url(#accent)"/>
      <g transform="translate(36 55)" fill="#132E3B" stroke="#58DDEA" stroke-width="2.3"><rect x="6" y="7" width="58" height="67" rx="9"/><rect x="22" width="27" height="18" rx="6"/></g>
      <text x="24" y="146" fill="#E5E7EB" font-size="25" font-weight="650">Clipboard</text>
      <text x="24" y="183" fill="#8193A2" font-size="16"><tspan x="24" dy="0">Keep a tray-accessible history</tspan><tspan x="24" dy="25">and paste flow.</tspan></text>
      <text x="24" y="278" fill="#55E5F1" font-size="30">→</text>
    </g>

    <g transform="translate(1176 0)">
      <rect width="276" height="310" rx="24" fill="#0F1B25" stroke="#28495C"/>
      <rect x="22" y="22" width="82" height="5" rx="2.5" fill="url(#accent)"/>
      <g transform="translate(24 60)"><rect width="92" height="60" rx="10" fill="#132E3B" stroke="#58DDEA" stroke-width="2.3"/><text x="17" y="39" fill="#58DDEA" font-family="ui-monospace, monospace" font-size="28" font-weight="700">&gt;_</text></g>
      <text x="24" y="146" fill="#E5E7EB" font-size="25" font-weight="650">Commands</text>
      <text x="24" y="183" fill="#8193A2" font-size="16"><tspan x="24" dy="0">Launch apps and automate</tspan><tspan x="24" dy="25">repetitive operations.</tspan></text>
      <text x="24" y="278" fill="#55E5F1" font-size="30">→</text>
    </g>
  </g>
</svg>
