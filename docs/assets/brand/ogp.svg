<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">iKeyd social preview</title>
  <desc id="desc">Dark cyan iKeyd social preview with product name, tagline and stylized keyboard.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B0F14"/><stop offset="1" stop-color="#0E1B26"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7AF5F4"/><stop offset="1" stop-color="#1CC6EA"/></linearGradient>
    <radialGradient id="glow"><stop offset="0" stop-color="#25D8EF" stop-opacity=".2"/><stop offset="1" stop-color="#25D8EF" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse"><path d="M60 0H0V60" fill="none" stroke="#27485B" stroke-opacity=".14"/></pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
