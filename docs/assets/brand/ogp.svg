    <text x="80" y="178" fill="#55E6F3" font-size="30" font-weight="500">I keyed it my way.</text>
    <rect x="80" y="211" width="124" height="5" rx="2.5" fill="url(#accent)"/>
    <text x="76" y="344" fill="#E5E7EB" font-size="50" font-weight="650">Your keyboard,</text>
    <text x="76" y="405" fill="#E5E7EB" font-size="50" font-weight="650">your workflow.</text>
    <text x="78" y="472" fill="#8193A2" font-size="20">Open-source keyboard customization runtime</text>
