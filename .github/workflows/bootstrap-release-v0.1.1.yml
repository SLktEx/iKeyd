name: Bootstrap v0.1.1 release

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/bootstrap-release-v0.1.1.yml'

permissions:
  actions: read
  contents: write

env:
  RELEASE_TAG: v0.1.1
  TARGET_SHA: 45e17f155226cfa8fb0160d28abbd4cdc1816d1b
  ARTIFACT_RUN: '33990914476'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
      - name: Create and push release tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "${RELEASE_TAG}" "${TARGET_SHA}"
          git push origin "${RELEASE_TAG}"
      - name: Download verified release artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "${ARTIFACT_RUN}" --repo "${GITHUB_REPOSITORY}" --name iKeyd-v0.1.1 --dir artifacts
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${RELEASE_TAG}"
          artifacts/iKeyd-win-x64.zip
          artifacts/iKeyd-win-x64/iKeyd.exe
          artifacts/iKeyd-win-x64/iKeyd.json
          artifacts/iKeyd-win-x64-embedded/iKeyd-embedded.exe
          --verify-tag
          --notes "Adds iKeyd-embedded.exe, a self-contained Windows x64 build with the default iKeyd configuration embedded in the executable."
          --title "iKeyd ${RELEASE_TAG}"
