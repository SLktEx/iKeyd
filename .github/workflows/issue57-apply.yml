name: Apply issue 57 compatibility patch

on:
  push:
    branches: [issue-46-hotkeyskg-full-compat]
    paths:
      - .github/workflows/issue57-apply.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-46-hotkeyskg-full-compat
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply focused compatibility patch
        shell: powershell
        run: |
          @'
          from pathlib import Path
          import re

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one exact match, found {count}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          runtime = 'src/iKeyd.App/IKeydRuntimeHandler.cs'
          replace_once(runtime,
          '''    private readonly DesktopActionService _desktopActions;\n    private readonly ChordEngine<string> _sEngine;''',
          '''    private readonly DesktopActionService _desktopActions;\n    private readonly WindowGroupController _windowGroup;\n    private readonly ChordEngine<string> _sEngine;''')

          replace_once(runtime,
          '''        _desktopActions = new DesktopActionService(desktop);\n        _sEngine = new ChordEngine<string>(configuration.SKeymap, configuration.ChordWindowMs);''',
          '''        _desktopActions = new DesktopActionService(desktop);\n        _windowGroup = new WindowGroupController(desktop);\n        _sEngine = new ChordEngine<string>(configuration.SKeymap, configuration.ChordWindowMs);''')

          replace_once(runtime,
          '''            case KeyCode.G:\n                if (state.IsExact(LayerKey.M, LayerKey.H)) { _send.SendChord(WindowsKeyMap.Control, WindowsKeyMap.Tab); return true; }\n                if (state.IsExact(LayerKey.H, LayerKey.M)) { _send.SendChord(WindowsKeyMap.Control, WindowsKeyMap.Shift, WindowsKeyMap.Tab); return true; }\n                break;\n\n            case KeyCode.B:\n                if (state.IsExact(LayerKey.M, LayerKey.H)) { _send.SendChord(WindowsKeyMap.Alt, WindowsKeyMap.Escape); return true; }\n                if (state.IsExact(LayerKey.H, LayerKey.M)) { _send.SendChord(WindowsKeyMap.Alt, WindowsKeyMap.Shift, WindowsKeyMap.Escape); return true; }\n                break;''',
          '''            case KeyCode.G:\n                if (state.IsExact(LayerKey.M)) { _windowGroup.ActivateNext(); return true; }\n                if (state.IsExact(LayerKey.M, LayerKey.H)) { _send.SendChord(WindowsKeyMap.Control, WindowsKeyMap.Tab); return true; }\n                if (state.IsExact(LayerKey.H, LayerKey.M)) { _send.SendChord(WindowsKeyMap.Control, WindowsKeyMap.Shift, WindowsKeyMap.Tab); return true; }\n                if (state.IsExact(LayerKey.M, LayerKey.S)) { _windowGroup.ToggleActiveWindow(); return true; }\n                break;\n\n            case KeyCode.B:\n                if (state.IsExact(LayerKey.M)) { _desktopActions.ActivateBottomWindowOfActiveClass(); return true; }\n                if (state.IsExact(LayerKey.M, LayerKey.H)) { _send.SendChord(WindowsKeyMap.Alt, WindowsKeyMap.Escape); return true; }\n                if (state.IsExact(LayerKey.H, LayerKey.M)) { _send.SendChord(WindowsKeyMap.Alt, WindowsKeyMap.Shift, WindowsKeyMap.Escape); return true; }\n                if (state.IsExact(LayerKey.M, LayerKey.S)) { _windowGroup.ResetAndAdvance(); return true; }\n                break;''')

          replace_once(runtime,
          '''        if (name == "G")\n        {\n            if (state == "MH") { _send.SendChord(WindowsKeyMap.Control, WindowsKeyMap.Tab); return true; }\n            if (state == "HM") { _send.SendChord(WindowsKeyMap.Control, WindowsKeyMap.Shift, WindowsKeyMap.Tab); return true; }\n        }\n\n        if (name == "B")\n        {\n            if (state == "MH") { _send.SendChord(WindowsKeyMap.Alt, WindowsKeyMap.Escape); return true; }\n            if (state == "HM") { _send.SendChord(WindowsKeyMap.Alt, WindowsKeyMap.Shift, WindowsKeyMap.Escape); return true; }\n        }''',
          '''        if (name == "G")\n        {\n            if (state == "M") { _windowGroup.ActivateNext(); return true; }\n            if (state == "MH") { _send.SendChord(WindowsKeyMap.Control, WindowsKeyMap.Tab); return true; }\n            if (state == "HM") { _send.SendChord(WindowsKeyMap.Control, WindowsKeyMap.Shift, WindowsKeyMap.Tab); return true; }\n            if (state == "MS") { _windowGroup.ToggleActiveWindow(); return true; }\n        }\n\n        if (name == "B")\n        {\n            if (state == "M") { _desktopActions.ActivateBottomWindowOfActiveClass(); return true; }\n            if (state == "MH") { _send.SendChord(WindowsKeyMap.Alt, WindowsKeyMap.Escape); return true; }\n            if (state == "HM") { _send.SendChord(WindowsKeyMap.Alt, WindowsKeyMap.Shift, WindowsKeyMap.Escape); return true; }\n            if (state == "MS") { _windowGroup.ResetAndAdvance(); return true; }\n        }''')

          p = Path(runtime)
          text = p.read_text(encoding='utf-8')
          pattern = re.compile(r'    private bool DispatchMouseMedia\(KeyId key\)\n    \{.*?\n    private void SendLayerAction', re.S)
          replacement = '''    private bool DispatchMouseMedia(KeyId key)\n    {\n        switch (key.Code)\n        {\n            case KeyCode.D:\n            case KeyCode.E:\n            case KeyCode.C:\n                return true;\n            case KeyCode.J:\n                MoveMouse(-1, 0);\n                return true;\n            case KeyCode.K:\n                MoveMouse(0, 1);\n                return true;\n            case KeyCode.L:\n                MoveMouse(1, 0);\n                return true;\n            case KeyCode.I:\n                MoveMouse(0, -1);\n                return true;\n            case KeyCode.U:\n                _desktop.Click(DesktopMouseButton.Left);\n                return true;\n            case KeyCode.O:\n                _desktop.Click(DesktopMouseButton.Right);\n                return true;\n            case KeyCode.Comma:\n                _desktop.Click(DesktopMouseButton.Middle);\n                return true;\n            case KeyCode.Y:\n                _desktopActions.ToggleMouseButton(DesktopMouseButton.Left);\n                return true;\n            case KeyCode.H:\n                // Preserve the pinned legacy typo: right-button down is unreachable,\n                // but an already-held right button is released.\n                if (_desktop.IsMouseButtonDown(DesktopMouseButton.Right))\n                    _desktop.SetMouseButton(DesktopMouseButton.Right, false);\n                return true;\n            case KeyCode.N:\n                MovePointerToLegacyWindowCorner(bottomRight: false);\n                return true;\n            case KeyCode.M:\n                MovePointerToLegacyWindowCorner(bottomRight: true);\n                return true;\n            case KeyCode.P:\n                _desktop.ScrollVertical(120);\n                return true;\n            case KeyCode.SColon:\n                _desktop.ScrollVertical(-120);\n                return true;\n            case KeyCode.At:\n                _desktop.ScrollVertical(120, controlModifier: true);\n                return true;\n            case KeyCode.Colon:\n                _desktop.ScrollVertical(-120, controlModifier: true);\n                return true;\n            case KeyCode.Q:\n                _desktop.SendMediaCommand(DesktopMediaCommand.VolumeUp);\n                return true;\n            case KeyCode.A:\n                _desktop.SendMediaCommand(DesktopMediaCommand.VolumeMute);\n                return true;\n            case KeyCode.Z:\n                _desktop.SendMediaCommand(DesktopMediaCommand.VolumeDown);\n                return true;\n            case KeyCode.R:\n                _desktop.SendMediaCommand(DesktopMediaCommand.NextTrack);\n                return true;\n            case KeyCode.F:\n                _desktop.SendMediaCommand(DesktopMediaCommand.PlayPause);\n                return true;\n            case KeyCode.V:\n                _desktop.SendMediaCommand(DesktopMediaCommand.PreviousTrack);\n                return true;\n            default:\n                return false;\n        }\n    }\n\n    private void MoveMouse(int xDirection, int yDirection)\n    {\n        if (_keyboardState.IsVirtualKeyPressed((ushort)'D'))\n        {\n            _desktop.MovePointerBy(xDirection * 30, yDirection * 30);\n            return;\n        }\n        if (_keyboardState.IsVirtualKeyPressed((ushort)'E'))\n        {\n            _desktop.MovePointerBy(xDirection * 10, yDirection * 10);\n            return;\n        }\n        if (_keyboardState.IsVirtualKeyPressed((ushort)'C'))\n        {\n            var area = _desktop.GetPrimaryWorkArea();\n            _desktop.MovePointerBy(\n                xDirection * Math.Max(1, area.Width / 4),\n                yDirection * Math.Max(1, area.Height / 4));\n            return;\n        }\n        _desktop.MovePointerBy(xDirection * 100, yDirection * 100);\n    }\n\n    private void MovePointerToLegacyWindowCorner(bool bottomRight)\n    {\n        var window = _desktop.GetActiveWindow();\n        if (!_desktop.IsWindow(window))\n            return;\n\n        var bounds = _desktop.GetWindowBounds(window);\n        if (bounds.X < 0)\n            return;\n\n        var point = bottomRight\n            ? new DesktopPoint(bounds.Right - 1, bounds.Bottom - 1)\n            : new DesktopPoint(bounds.X + 1, bounds.Y + 1);\n        _desktop.MovePointer(point);\n    }\n\n    private void SendLayerAction'''
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'{runtime}: DispatchMouseMedia block match count={count}')
          p.write_text(text, encoding='utf-8')

          runner = 'tests/iKeyd.Windows.Tests/IKeydRuntimeScenarioRunner.cs'
          replace_once(runner,
          '''    private static string ProfilePath => Path.Combine(AppContext.BaseDirectory, "Fixtures", "hotkeySKG.behavior.json");\n\n    public string Name => "iKeyd.Runtime";''',
          '''    private static string ProfilePath => Path.Combine(AppContext.BaseDirectory, "Fixtures", "hotkeySKG.behavior.json");\n    private readonly DesktopMouseButton[] _initialMouseButtons;\n\n    public IKeydRuntimeScenarioRunner(params DesktopMouseButton[] initialMouseButtons)\n        => _initialMouseButtons = initialMouseButtons ?? [];\n\n    public string Name => "iKeyd.Runtime";''')
          replace_once(runner,
          '''        var desktop = new RecordingDesktopBackend();\n        var inputMethod = new FixedInputMethod(''',
          '''        var desktop = new RecordingDesktopBackend();\n        desktop.SetInitialMouseButtons(_initialMouseButtons);\n        var inputMethod = new FixedInputMethod(''')
          replace_once(runner,
          '''        private readonly WindowHandle _window = new(1);\n        private readonly HashSet<DesktopMouseButton> _buttons = [];''',
          '''        private readonly WindowHandle _window = new(1);\n        private readonly WindowHandle _secondaryWindow = new(2);\n        private readonly HashSet<DesktopMouseButton> _buttons = [];''')
          replace_once(runner,
          '''        public string? GetWindowClass(WindowHandle window) => "iKeydScenarioWindow";\n        public bool IsWindow(WindowHandle window) => window == _window;''',
          '''        public string? GetWindowClass(WindowHandle window) => "iKeydScenarioWindow";\n        public bool IsWindow(WindowHandle window) => window == _window || window == _secondaryWindow;''')
          replace_once(runner,
          '''        public void Activate(WindowHandle window) => Add("window", "activate");\n        public IReadOnlyList<WindowHandle> EnumerateTopLevelWindows() => [_window];''',
          '''        public void Activate(WindowHandle window) => Add("window", "activate");\n        public IReadOnlyList<WindowHandle> EnumerateTopLevelWindows() => [_window, _secondaryWindow];''')
          replace_once(runner,
          '''        public bool IsMouseButtonDown(DesktopMouseButton button) => _buttons.Contains(button);\n        public void SetMouseButton(DesktopMouseButton button, bool down)''',
          '''        public void SetInitialMouseButtons(IEnumerable<DesktopMouseButton> buttons)\n        {\n            foreach (var button in buttons)\n                _buttons.Add(button);\n        }\n\n        public bool IsMouseButtonDown(DesktopMouseButton button) => _buttons.Contains(button);\n        public void SetMouseButton(DesktopMouseButton button, bool down)''')

          legacy = 'tests/iKeyd.Windows.Tests/LegacySendEventScenarioRunner.cs'
          replace_once(legacy,
          '''    private static void SendScenarioInput(ScenarioInputEvent input)\n    {\n        var virtualKey = ResolveVirtualKey(input.Key!);\n        SendKey(\n            virtualKey,\n            0,\n            string.Equals(input.Kind, "keyUp", StringComparison.OrdinalIgnoreCase));\n    }''',
          '''    private static void SendScenarioInput(ScenarioInputEvent input)\n    {\n        var virtualKey = ResolveVirtualKey(input.Key!);\n        var scanCode = ResolveScanCode(input.Key!);\n        SendKey(\n            virtualKey,\n            scanCode,\n            string.Equals(input.Kind, "keyUp", StringComparison.OrdinalIgnoreCase));\n    }''')
          replace_once(legacy,
          '''            "COMMA" => 0xBC,\n            "SCOLON" => 0xBA,''',
          '''            "KANA" => 0x15,\n            "COMMA" => 0xBC,\n            "SCOLON" => 0xBA,''')
          replace_once(legacy,
          '''        };\n    }\n\n    private static void SendKey(byte virtualKey, byte scanCode, bool keyUp)''',
          '''        };\n    }\n\n    private static byte ResolveScanCode(string key)\n        => key.Trim().ToUpperInvariant() switch\n        {\n            "KANA" => 0x70,\n            _ => 0\n        };\n\n    private static void SendKey(byte virtualKey, byte scanCode, bool keyUp)''')
          replace_once(legacy,
          '''                0x12 => "Alt",\n                0x20 => "Space",''',
          '''                0x12 => "Alt",\n                0x1B => "Escape",\n                0x20 => "Space",''')

          hosted = 'tests/iKeyd.Windows.Tests/HostedLegacyDifferentialTests.cs'
          p = Path(hosted)
          text = p.read_text(encoding='utf-8')
          marker = '''    [Fact]\n    public void Hosted_adapter_bootstraps_inner_runner_in_S_mode_and_disables_IME_dependency()'''
          if text.count(marker) != 1:
              raise SystemExit(f'{hosted}: insertion marker mismatch')
          addition = '''    [Fact]\n    [Trait("Category", "HostedLegacyDifferentialE2E")]\n    public async Task S_Kana_keeps_iKeyd_deterministic_while_accepting_the_observed_compiled_EXE_tail_race()\n    {\n        if (!OperatingSystem.IsWindows())\n            return;\n\n        var legacyRunner = new LegacySendEventScenarioRunner();\n        if (!legacyRunner.IsAvailable)\n            return;\n\n        var stableEvents = new List<ObservedKeyEvent>\n        {\n            new() { Kind = "keyDown", Key = "Control" },\n            new() { Kind = "keyDown", Key = "Escape" },\n            new() { Kind = "keyUp", Key = "Escape" },\n            new() { Kind = "keyUp", Key = "Control" }\n        };\n        var scenario = new CompatibilityScenario\n        {\n            Id = "runtime-s-kana-known-compiled-tail-race",\n            InitialState = new ScenarioInitialState { Mode = "S", Ime = "off", Layers = ["S"] },\n            Input =\n            [\n                new ScenarioInputEvent { AtMs = 10, Kind = "keyDown", Key = "KANA" },\n                new ScenarioInputEvent { AtMs = 11, Kind = "keyUp", Key = "KANA" }\n            ],\n            Expected = new ScenarioExpected { Events = stableEvents }\n        };\n\n        var iKeyd = await new IKeydRuntimeScenarioRunner().RunAsync(scenario);\n        Assert.Empty(CompatibilityScenarioDiff.Compare(scenario, iKeyd));\n\n        var legacy = await legacyRunner.RunAsync(scenario);\n        var withSpaceTail = stableEvents.Concat(\n        [\n            new ObservedKeyEvent { Kind = "keyDown", Key = "Space" },\n            new ObservedKeyEvent { Kind = "keyUp", Key = "Space" }\n        ]).ToArray();\n\n        Assert.True(\n            EventSequenceEquals(legacy.Events, stableEvents) || EventSequenceEquals(legacy.Events, withSpaceTail),\n            $"Pinned compiled EXE produced an unrecognized S+Kana sequence: {string.Join(", ", legacy.Events.Select(item => $"{item.Kind}:{item.Key}"))}");\n    }\n\n'''
          p.write_text(text.replace(marker, addition + marker, 1), encoding='utf-8')

          p = Path(hosted)
          text = p.read_text(encoding='utf-8')
          helper_marker = '''    private static CompatibilityScenario[] LoadTagged(string tag)'''
          helper = '''    private static bool EventSequenceEquals(\n        IReadOnlyList<ObservedKeyEvent> actual,\n        IReadOnlyList<ObservedKeyEvent> expected)\n    {\n        if (actual.Count != expected.Count)\n            return false;\n        for (var index = 0; index < actual.Count; index++)\n        {\n            if (!string.Equals(actual[index].Kind, expected[index].Kind, StringComparison.OrdinalIgnoreCase) ||\n                !string.Equals(actual[index].Key, expected[index].Key, StringComparison.OrdinalIgnoreCase))\n                return false;\n        }\n        return true;\n    }\n\n'''
          if text.count(helper_marker) != 1:
              raise SystemExit(f'{hosted}: helper marker mismatch')
          p.write_text(text.replace(helper_marker, helper + helper_marker, 1), encoding='utf-8')

          Path('tests/iKeyd.Windows.Tests/Issue57RuntimeCompatibilityTests.cs').write_text(r'''using iKeyd.Compatibility.Tests;
using iKeyd.Core.Desktop;
using Xunit;

namespace iKeyd.Windows.Tests;

public sealed class Issue57RuntimeCompatibilityTests
{
    [Fact]
    public async Task Remaining_SM_mouse_and_window_group_branches_match_legacy_semantics()
    {
        var runner = new IKeydRuntimeScenarioRunner();
        var scenarios = new[]
        {
            Scenario(
                "issue57-sm-left-toggle",
                ["S", "M"],
                [Down(10, "Y"), Up(11, "Y"), Down(12, "Y"), Up(13, "Y")],
                [Action("mouse", "button:left:down"), Action("mouse", "button:left:up")]),
            Scenario(
                "issue57-sm-top-left-corner",
                ["S", "M"],
                [Down(10, "N"), Up(11, "N")],
                [Action("mouse", "move:101,101")]),
            Scenario(
                "issue57-sm-bottom-right-corner",
                ["S", "M"],
                [Down(10, "M"), Up(11, "M")],
                [Action("mouse", "move:899,699")]),
            Scenario(
                "issue57-sm-quarter-height-up",
                ["S", "M"],
                [Down(10, "C"), Down(11, "I"), Up(12, "I"), Up(13, "C")],
                [Action("mouse", "move-by:0,-270")]),
            Scenario(
                "issue57-window-group-toggle-next",
                ["M", "S"],
                [Down(10, "G"), Up(11, "G"), Up(12, "SPACE"), Down(13, "G"), Up(14, "G")],
                [Action("window", "activate")]),
            Scenario(
                "issue57-window-group-reset",
                ["M", "S"],
                [Down(10, "G"), Up(11, "G"), Down(12, "B"), Up(13, "B"), Up(14, "SPACE"), Down(15, "G"), Up(16, "G")],
                []),
            Scenario(
                "issue57-bottom-window-of-class",
                ["M"],
                [Down(10, "B"), Up(11, "B")],
                [Action("window", "activate")])
        };

        foreach (var scenario in scenarios)
        {
            var result = await runner.RunAsync(scenario);
            var differences = CompatibilityScenarioDiff.Compare(scenario, result);
            Assert.True(differences.Count == 0, $"{scenario.Id}: {string.Join("; ", differences)}");
        }
    }

    [Fact]
    public async Task SM_H_preserves_legacy_right_button_release_only_typo()
    {
        var scenario = Scenario(
            "issue57-sm-right-release-only",
            ["S", "M"],
            [Down(10, "H"), Up(11, "H")],
            [Action("mouse", "button:right:up")]);

        var result = await new IKeydRuntimeScenarioRunner(DesktopMouseButton.Right).RunAsync(scenario);
        var differences = CompatibilityScenarioDiff.Compare(scenario, result);
        Assert.True(differences.Count == 0, string.Join("; ", differences));
    }

    private static CompatibilityScenario Scenario(
        string id,
        List<string> layers,
        List<ScenarioInputEvent> input,
        List<ObservedAction> actions)
        => new()
        {
            Id = id,
            InitialState = new ScenarioInitialState { Mode = "S", Ime = "off", Layers = layers },
            Input = input,
            Expected = new ScenarioExpected { Actions = actions },
            Tags = ["issue57-deterministic"]
        };

    private static ScenarioInputEvent Down(long atMs, string key)
        => new() { AtMs = atMs, Kind = "keyDown", Key = key };

    private static ScenarioInputEvent Up(long atMs, string key)
        => new() { AtMs = atMs, Kind = "keyUp", Key = key };

    private static ObservedAction Action(string kind, string value)
        => new() { Kind = kind, Value = value };
}
''', encoding='utf-8')
          '@ | python -
      - name: Tooling tests
        run: python -m unittest discover tests/tooling -p 'test_*.py' -v
      - name: Restore
        run: dotnet restore iKeyd.sln
      - name: Build
        run: dotnet build iKeyd.sln --no-restore --configuration Release
      - name: Test
        run: dotnet test iKeyd.sln --no-build --configuration Release
      - name: Commit validated patch
        shell: powershell
        run: |
          Remove-Item .github/workflows/issue57-apply.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: cover hotkeySKG SM and window-group long tail (#57)"
          git push origin HEAD:issue-46-hotkeyskg-full-compat
