name: Bootstrap v0.1.0 release

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/bootstrap-release-v0.1.0.yml'

permissions:
  contents: write

env:
  RELEASE_TAG: v0.1.0
  TARGET_SHA: e32f36d5e80c689cd94ae01a0ed233016ec6e804

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore iKeyd.sln
      - run: dotnet test iKeyd.sln --no-restore --configuration Release
      - name: Publish win-x64
        run: >-
          dotnet publish src/iKeyd.App/iKeyd.App.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:DebugType=None
          -p:DebugSymbols=false
          --output artifacts/iKeyd-win-x64
      - name: Create release archive
        shell: pwsh
        run: Compress-Archive -Path artifacts/iKeyd-win-x64/* -DestinationPath artifacts/iKeyd-win-x64.zip -Force
      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create $env:RELEASE_TAG
          artifacts/iKeyd-win-x64.zip
          artifacts/iKeyd-win-x64/iKeyd.exe
          artifacts/iKeyd-win-x64/iKeyd.json
          --target $env:TARGET_SHA
          --generate-notes
          --title "iKeyd $env:RELEASE_TAG"
