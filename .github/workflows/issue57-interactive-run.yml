name: Validate hotkeySKG macro and clipboard reachability

on:
  push:
    branches: [issue-46-hotkeyskg-full-compat]
    paths:
      - .github/workflows/issue57-interactive-run.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-46-hotkeyskg-full-compat
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Apply interactive compatibility patch
        run: python -B tools/issue57_interactive_patch.py
      - name: Restore
        run: dotnet restore iKeyd.sln
      - name: Build
        run: dotnet build iKeyd.sln --no-restore --configuration Release
      - name: Test
        run: dotnet test iKeyd.sln --no-build --configuration Release
      - name: Commit validated patch
        shell: powershell
        run: |
          Remove-Item .github/workflows/issue57-interactive-run.yml
          Remove-Item tools/issue57_interactive_patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: wire legacy macro and clipboard hotkeys (#57)"
          git push origin HEAD:issue-46-hotkeyskg-full-compat
