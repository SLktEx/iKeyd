name: Validate narrow mouse coverage patch

on:
  push:
    branches: [fix/matrix-mouse-intentional-differences-v3]
    paths:
      - .github/workflows/issue46-mouse-matrix-v3.yml
      - tools/issue46_mark_mouse_intentional_preserve.py

permissions:
  contents: write

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/matrix-mouse-intentional-differences-v3
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply exact five-rule patch
        run: python tools/issue46_mark_mouse_intentional_preserve.py
      - name: Run tooling suite
        run: python -m unittest discover tests/tooling -p 'test_*.py' -v
      - name: Verify tiny diff
        shell: powershell
        run: |
          $files = @((git diff --name-only HEAD) + (git ls-files --others --exclude-standard)) | Where-Object { $_ } | Sort-Object -Unique
          $expected = @('tests/compatibility/coverage-rules.json','tests/tooling/test_mouse_intentional_coverage.py') | Sort-Object
          if (($files -join "`n") -ne ($expected -join "`n")) {
            throw "Unexpected changed files: $($files -join ', ')"
          }
          $stats = git diff --numstat HEAD -- tests/compatibility/coverage-rules.json
          Write-Host $stats
      - name: Commit validated matrix metadata
        shell: powershell
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/compatibility/coverage-rules.json tests/tooling/test_mouse_intentional_coverage.py
          git commit -m "test: mark accepted v0.4 mouse differences in matrix"
          git push origin HEAD:fix/matrix-mouse-intentional-differences-v3
