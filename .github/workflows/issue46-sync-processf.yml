name: Validate latest processF main sync

on:
  push:
    branches: [issue-46-hotkeyskg-full-compat]
    paths:
      - .github/workflows/issue46-sync-processf.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-46-hotkeyskg-full-compat
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Merge latest main and preserve compatibility runtime
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          set +e
          git merge origin/main --no-commit --no-ff
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            conflicts="$(git diff --name-only --diff-filter=U)"
            unexpected="$(printf '%s\n' "$conflicts" | grep -v -E '^src/iKeyd.App/IKeydRuntimeHandler.cs$' || true)"
            if [ -n "$unexpected" ]; then
              echo "Unexpected conflicts:"
              echo "$unexpected"
              exit 1
            fi
            if printf '%s\n' "$conflicts" | grep -Fxq 'src/iKeyd.App/IKeydRuntimeHandler.cs'; then
              git checkout --ours -- src/iKeyd.App/IKeydRuntimeHandler.cs
              git add src/iKeyd.App/IKeydRuntimeHandler.cs
            fi
          fi
          python -B tools/issue46_sync_processf.py
          git add src/iKeyd.App/IKeydRuntimeHandler.cs tests/iKeyd.Compatibility.Tests/Scenarios/runtime-mouse-right-hold-toggle-sm-h.json
          test -z "$(git diff --name-only --diff-filter=U)"
      - name: Restore
        run: dotnet restore iKeyd.sln
      - name: Build
        run: dotnet build iKeyd.sln --no-restore --configuration Release
      - name: Test
        run: dotnet test iKeyd.sln --no-build --configuration Release
      - name: Tooling tests
        run: python -m unittest discover -s tests/tooling -p "test_*.py"
      - name: Commit validated merge
        shell: bash
        run: |
          set -e
          rm .github/workflows/issue46-sync-processf.yml
          rm tools/issue46_sync_processf.py
          git add -A
          git commit -m "Merge latest main processF compatibility into hotkeySKG branch"
          git push origin HEAD:issue-46-hotkeyskg-full-compat
