name: Clean tracked Python bytecode

on:
  push:
    branches: [issue-46-hotkeyskg-full-compat]
    paths:
      - .github/workflows/issue46-clean-pycache.yml

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-46-hotkeyskg-full-compat
      - name: Remove tracked bytecode and commit
        shell: bash
        run: |
          set -e
          rm -rf tests/tooling/__pycache__ tools/__pycache__
          rm .github/workflows/issue46-clean-pycache.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: remove tracked Python bytecode caches"
          git push origin HEAD:issue-46-hotkeyskg-full-compat
