name: Validate actual remaining compatibility gaps

on:
  push:
    branches: [issue-57-final-actual]
    paths:
      - .github/workflows/issue57-final-actual.yml

permissions:
  contents: write

concurrency:
  group: issue57-final-actual
  cancel-in-progress: true

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-57-final-actual
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Fetch validated landing source
        shell: bash
        run: git fetch origin issue-57-final-landing:refs/remotes/origin/issue-57-final-landing
      - name: Apply actual remaining gaps
        run: python -B tools/issue57_apply_actual.py
      - name: Restore
        run: dotnet restore iKeyd.sln
      - name: Build
        run: dotnet build iKeyd.sln --no-restore --configuration Release
      - name: Full .NET tests
        run: dotnet test iKeyd.sln --no-build --configuration Release
      - name: Tooling tests
        run: python -B -m unittest discover tests/tooling
      - name: Resolve GnuPG
        id: gpg
        shell: powershell
        run: |
          $gpg = Join-Path $env:ProgramFiles 'Git\usr\bin\gpg.exe'
          if (-not (Test-Path $gpg)) { $gpg = (Get-Command gpg.exe).Source }
          "path=$gpg" >> $env:GITHUB_OUTPUT
      - name: Decrypt pinned legacy artifacts
        id: legacy
        shell: powershell
        env:
          LEGACY_EXE_GPG_PASSPHRASE: ${{ secrets.LEGACY_EXE_GPG_PASSPHRASE }}
        run: |
          $exe = Join-Path $env:RUNNER_TEMP 'compiled-hotkeySKG.exe'
          $ahk = Join-Path $env:RUNNER_TEMP 'hotkeySKG.ahk'
          & '${{ steps.gpg.outputs.path }}' --batch --yes --pinentry-mode loopback --passphrase $env:LEGACY_EXE_GPG_PASSPHRASE --output $exe --decrypt tests\legacy-binary\hotkeySKG.exe.gpg
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & '${{ steps.gpg.outputs.path }}' --batch --yes --pinentry-mode loopback --passphrase $env:LEGACY_EXE_GPG_PASSPHRASE --output $ahk --decrypt tests\legacy-binary\hotkeySKG.ahk.gpg.asc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ((Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant() -ne '5492198ce403d796c8588b17419bce82a0e6de3961bb40896a875ee5dee359ea') { throw 'compiled EXE hash mismatch' }
          if ((Get-FileHash $ahk -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'fde46d179a2cfb8123a314d4ea6b8de714a65302867d4b3a654af07f9472bab7') { throw 'AHK source hash mismatch' }
          "exe=$exe" >> $env:GITHUB_OUTPUT
          "ahk=$ahk" >> $env:GITHUB_OUTPUT
      - name: Gate compatibility matrix
        shell: powershell
        env:
          IKEYD_LEGACY_AHK: ${{ steps.legacy.outputs.ahk }}
        run: |
          $out = 'TestResults\compatibility-inventory'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $matrix = Join-Path $out 'compatibility-matrix.json'
          $markdown = Join-Path $out 'compatibility-matrix.md'
          python -B tools/analyze-legacy-compatibility.py $env:IKEYD_LEGACY_AHK --coverage tests/compatibility/coverage-rules.json --profile config/hotkeySKG.behavior.json --scenarios tests/iKeyd.Compatibility.Tests/Scenarios --json $matrix --markdown $markdown
          python -B tools/apply-scenario-coverage.py --matrix $matrix --scenarios tests/iKeyd.Compatibility.Tests/Scenarios --links tests/iKeyd.Compatibility.Tests/ScenarioInventoryLinks.json --markdown $markdown
          $data = Get-Content $matrix -Raw | ConvertFrom-Json
          if ([int]$data.summary.unknownCount -ne 0 -or [int]$data.summary.missingCount -ne 0) { throw "matrix not complete: unknown=$($data.summary.unknownCount) missing=$($data.summary.missingCount)" }
          if (Select-String -Path $matrix -Pattern 'deferred:#57|pending:#57') { throw 'stale #57 handoff remains' }
      - name: Download pinned AHK v1
        id: ahk
        shell: powershell
        run: |
          $url = 'https://raw.githubusercontent.com/2wayne/AutoHotkey_LPortable/2fca5b7f6b84e8c9574b78b01c101831068016e5/App/AutoHotkey/AutoHotkey.exe'
          $path = Join-Path $env:RUNNER_TEMP 'AutoHotkey-v1.1.16.05.exe'
          Invoke-WebRequest $url -OutFile $path
          if ((Get-Item $path).Length -ne 910848) { throw 'unexpected AHK size' }
          if ((& git hash-object $path).Trim().ToLowerInvariant() -ne 'a776454e1eccfdcb92b7ab5214bca2832d52a1e8') { throw 'AHK blob mismatch' }
          "path=$path" >> $env:GITHUB_OUTPUT
      - name: Compiled EXE differential
        shell: powershell
        env:
          IKEYD_LEGACY_EXE: ${{ steps.legacy.outputs.exe }}
          IKEYD_LEGACY_EXE_SHA256: 5492198ce403d796c8588b17419bce82a0e6de3961bb40896a875ee5dee359ea
        run: dotnet test tests/iKeyd.Windows.Tests/iKeyd.Windows.Tests.csproj --no-restore --configuration Release --filter 'Category=HostedLegacyDifferentialE2E'
      - name: AHK source differential
        shell: powershell
        env:
          IKEYD_AHK_V1_EXE: ${{ steps.ahk.outputs.path }}
          IKEYD_LEGACY_AHK: ${{ steps.legacy.outputs.ahk }}
        run: |
          $args = @('test','tests/iKeyd.Windows.Tests/iKeyd.Windows.Tests.csproj','--no-restore','--configuration','Release','--filter','Category=HostedAhkSourceDifferentialE2E')
          & dotnet @args
          if ($LASTEXITCODE -ne 0) { Start-Sleep -Seconds 2; & dotnet @args; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE } }
      - name: Commit validated gaps
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src tests
          git commit -m 'fix: close final hosted hotkeySKG compatibility gaps (#57)'
          git push origin HEAD:issue-57-final-actual
