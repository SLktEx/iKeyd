name: Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/assets/brand/ikeyd-icon.png"
      - "docs/assets/brand/ikeyd-logo.png"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Keep website brand assets in sync with canonical files
        run: |
          mkdir -p site/assets
          cp docs/assets/brand/ikeyd-icon.png site/assets/ikeyd-icon.png
          cp docs/assets/brand/ikeyd-logo.png site/assets/ikeyd-logo.png
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
