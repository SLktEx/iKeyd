name: Validate latest main semantic sync

on:
  push:
    branches: [issue-46-hotkeyskg-full-compat]
    paths:
      - .github/workflows/issue46-sync-latest-main.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-46-hotkeyskg-full-compat
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Merge latest main and resolve compatibility overlap
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          set +e
          git merge origin/main --no-commit --no-ff
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            conflicts="$(git diff --name-only --diff-filter=U)"
            unexpected="$(printf '%s\n' "$conflicts" | grep -v -E '^(src/iKeyd.App/IKeydRuntimeHandler.cs|src/iKeyd.App/WindowsKeyMap.cs|tests/iKeyd.Windows.Tests/LegacySendEventScenarioRunner.cs)$' || true)"
            if [ -n "$unexpected" ]; then
              echo "Unexpected conflicts:"
              echo "$unexpected"
              exit 1
            fi
            if printf '%s\n' "$conflicts" | grep -Fxq 'src/iKeyd.App/IKeydRuntimeHandler.cs'; then
              git checkout --ours -- src/iKeyd.App/IKeydRuntimeHandler.cs
              git add src/iKeyd.App/IKeydRuntimeHandler.cs
            fi
            for path in src/iKeyd.App/WindowsKeyMap.cs tests/iKeyd.Windows.Tests/LegacySendEventScenarioRunner.cs; do
              if printf '%s\n' "$conflicts" | grep -Fxq "$path"; then
                git checkout --theirs -- "$path"
                git add "$path"
              fi
            done
          fi
          python -B tools/issue46_sync_latest_main.py
          git add src/iKeyd.App/IKeydRuntimeHandler.cs src/iKeyd.App/WindowsKeyMap.cs tests/iKeyd.Windows.Tests/LegacySendEventScenarioRunner.cs
      - name: Restore
        run: dotnet restore iKeyd.sln
      - name: Build
        run: dotnet build iKeyd.sln --no-restore --configuration Release
      - name: Test
        run: dotnet test iKeyd.sln --no-build --configuration Release
      - name: Commit validated merge
        shell: bash
        run: |
          set -e
          rm .github/workflows/issue46-sync-latest-main.yml
          rm tools/issue46_sync_latest_main.py
          git add -A
          git commit -m "Merge latest main into hotkeySKG compatibility"
          git push origin HEAD:issue-46-hotkeyskg-full-compat
# rerun: semantic markers allow Git's successful auto-merges
