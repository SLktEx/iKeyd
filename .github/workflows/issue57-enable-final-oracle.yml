name: Enable final issue57 legacy oracle

on:
  push:
    branches: [issue-46-hotkeyskg-full-compat]
    paths:
      - .github/workflows/issue57-enable-final-oracle.yml

permissions:
  contents: write

jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-46-hotkeyskg-full-compat
      - name: Enable branch oracle trigger and commit
        shell: bash
        run: |
          set -e
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/legacy-differential.yml')
          text = p.read_text(encoding='utf-8')
          old = '    branches: [main]\n'
          new = '    branches: [main, issue-46-hotkeyskg-full-compat]\n'
          if text.count(old) != 1:
              raise SystemExit(f'expected one main-only push branch declaration, found {text.count(old)}')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          rm .github/workflows/issue57-enable-final-oracle.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'ci: run final issue57 legacy differential'
          git push origin HEAD:issue-46-hotkeyskg-full-compat
