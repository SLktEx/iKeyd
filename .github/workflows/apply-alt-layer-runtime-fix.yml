name: Apply verified Alt layer runtime fix

on:
  push:
    branches: [test/v0.7-ka-layer-physical]
    paths:
      - .github/workflows/apply-alt-layer-runtime-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/v0.7-ka-layer-physical
          fetch-depth: 0

      - name: Apply minimal runtime fix
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/iKeyd.App/IKeydRuntimeHandler.cs')
          text = path.read_text(encoding='utf-8')
          old = '''        var keyId = WindowsKeyMap.TryResolveKeyId(keyboardEvent.Key);

        if (_layers.Layers.Count != 0)
        {
            var handled = keyId is not null && DispatchLayeredKey(keyId.Value, keyboardEvent.Key.VirtualKey);
            _layers = _layers.MarkConsumed();
'''
          new = '''        var keyId = WindowsKeyMap.TryResolveKeyId(keyboardEvent.Key);

        // Physical Alt is also the selector for Alt+Convert / Alt+Space / Alt+Kana.
        // When an internal layer is already active (for example AM), Alt-down must
        // remain transparent until the following layer trigger arrives. Treating
        // the pass-through Alt itself as layer consumption makes the legacy
        // AMS + AltSpaceUp branch physically unreachable.
        if (_layers.Layers.Count != 0 &&
            keyboardEvent.Key.VirtualKey is WindowsKeyMap.Alt or WindowsKeyMap.LeftAlt or WindowsKeyMap.RightAlt)
        {
            return KeyboardDisposition.PassThrough;
        }

        if (_layers.Layers.Count != 0)
        {
            var handled = keyId is not null && DispatchLayeredKey(keyId.Value, keyboardEvent.Key.VirtualKey);
            _layers = _layers.MarkConsumed();
'''
          if old not in text:
              raise SystemExit('expected runtime block was not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

          workflow = Path('.github/workflows/apply-alt-layer-runtime-fix.yml')
          workflow.unlink()

      - name: Commit fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/iKeyd.App/IKeydRuntimeHandler.cs .github/workflows/apply-alt-layer-runtime-fix.yml
          git commit -m 'fix(v0.7): preserve Alt selector while layers are active'
          git push origin HEAD:test/v0.7-ka-layer-physical
