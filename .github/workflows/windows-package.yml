name: Windows package

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
  pull_request:
    paths:
      - '.github/workflows/windows-package.yml'
      - 'src/iKeyd.App/**'
      - 'src/iKeyd.Core/**'
      - 'src/iKeyd.Windows/**'
      - 'config/**'

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore iKeyd.sln
      - run: dotnet test iKeyd.sln --no-restore --configuration Release
      - name: Publish win-x64
        run: >-
          dotnet publish src/iKeyd.App/iKeyd.App.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:DebugType=None
          -p:DebugSymbols=false
          --output artifacts/iKeyd-win-x64
      - name: Create release archive
        shell: pwsh
        run: Compress-Archive -Path artifacts/iKeyd-win-x64/* -DestinationPath artifacts/iKeyd-win-x64.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: iKeyd-win-x64
          path: |
            artifacts/iKeyd-win-x64/**
            artifacts/iKeyd-win-x64.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: iKeyd-win-x64
          path: artifacts
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          artifacts/iKeyd-win-x64.zip
          artifacts/iKeyd.exe
          artifacts/iKeyd.json
          --verify-tag
          --generate-notes
          --title "iKeyd ${GITHUB_REF_NAME}"
