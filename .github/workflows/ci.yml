name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python -m unittest discover tests/tooling -p 'test_*.py' -v
      - run: dotnet restore iKeyd.sln
      - run: dotnet build iKeyd.sln --no-restore --configuration Release
      - name: Compile built-in JIS109 DSL preset
        shell: pwsh
        run: |
          dotnet tools/iKeyd.ProfileCompiler/bin/Release/net8.0/iKeyd.ProfileCompiler.dll `
            tests/tooling/fixtures/jis109-preset.ikeyd `
            "$env:RUNNER_TEMP/Jis109Preset.g.cs" `
            --emit-json "$env:RUNNER_TEMP/jis109-preset.json"
      - name: Compile tap hold behavior DSL
        shell: pwsh
        run: |
          dotnet tools/iKeyd.ProfileCompiler/bin/Release/net8.0/iKeyd.ProfileCompiler.dll `
            tests/tooling/fixtures/behaviors.ikeyd `
            "$env:RUNNER_TEMP/Behaviors.g.cs" `
            --emit-json "$env:RUNNER_TEMP/behaviors.json"
      - name: Compile automation action DSL
        shell: pwsh
        run: |
          dotnet tools/iKeyd.ProfileCompiler/bin/Release/net8.0/iKeyd.ProfileCompiler.dll `
            tests/tooling/fixtures/automation-actions.ikeyd `
            "$env:RUNNER_TEMP/AutomationActions.g.cs" `
            --emit-json "$env:RUNNER_TEMP/automation-actions.json"
      - name: Compile conditional action DSL
        shell: pwsh
        run: |
          dotnet tools/iKeyd.ProfileCompiler/bin/Release/net8.0/iKeyd.ProfileCompiler.dll `
            tests/tooling/fixtures/conditional-actions.ikeyd `
            "$env:RUNNER_TEMP/ConditionalActions.g.cs" `
            --emit-json "$env:RUNNER_TEMP/conditional-actions.json"
      - run: dotnet test iKeyd.sln --no-build --configuration Release
