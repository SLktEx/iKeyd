name: CI

on:
  push:
    branches: [main, issue-46-hotkeyskg-full-compat]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python -m unittest discover tests/tooling -p 'test_*.py' -v
      - run: dotnet restore iKeyd.sln
      - run: dotnet build iKeyd.sln --no-restore --configuration Release
      - run: dotnet test iKeyd.sln --no-build --configuration Release