name: Legacy differential

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - tests/legacy-binary/hotkeySKG.exe.gpg
      - tests/legacy-binary/hotkeySKG.ahk.gpg.asc
      - .github/workflows/legacy-differential.yml
      - tools/analyze-legacy-compatibility.py
      - tools/analyze-send-syntax.py
      - tools/apply-scenario-coverage.py
      - tools/validate-scenario-inventory-links.py
      - tests/compatibility/coverage-rules.json
      - config/hotkeySKG.behavior.json
      - tests/iKeyd.Compatibility.Tests/Scenarios/**
      - tests/iKeyd.Compatibility.Tests/ScenarioInventoryLinks.json
      - tests/iKeyd.Windows.Tests/LegacyDifferentialComparison.cs
      - tests/iKeyd.Windows.Tests/HostedTModeLegacyRunner.cs
      - tests/iKeyd.Windows.Tests/HostedLegacyDifferentialTests.cs
      - tests/iKeyd.Windows.Tests/HostedAutoHotkeySourceRunner.cs
      - tests/iKeyd.Windows.Tests/HostedAutoHotkeySourceDifferentialTests.cs

permissions:
  contents: read

concurrency:
  group: legacy-oracles-v1
  cancel-in-progress: true

jobs:
  compare:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Resolve bundled GnuPG
        id: gpg
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $gpg = Join-Path $env:ProgramFiles 'Git\usr\bin\gpg.exe'
          if (-not (Test-Path -LiteralPath $gpg -PathType Leaf)) {
            $command = Get-Command gpg.exe -ErrorAction SilentlyContinue
            if ($null -eq $command) {
              throw 'GnuPG was not found in Git for Windows or PATH.'
            }
            $gpg = $command.Source
          }
          "path=$gpg" >> $env:GITHUB_OUTPUT
          Write-Host "Using GnuPG: $gpg"

      - name: Decrypt pinned compiled legacy executable
        id: legacy
        shell: powershell
        env:
          LEGACY_EXE_GPG_PASSPHRASE: ${{ secrets.LEGACY_EXE_GPG_PASSPHRASE }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:LEGACY_EXE_GPG_PASSPHRASE)) {
            throw 'Repository secret LEGACY_EXE_GPG_PASSPHRASE is not configured.'
          }

          $encrypted = Join-Path $PWD 'tests\legacy-binary\hotkeySKG.exe.gpg'
          $path = Join-Path $env:RUNNER_TEMP 'compiled-hotkeySKG.exe'
          & '${{ steps.gpg.outputs.path }}' `
            --batch --yes --pinentry-mode loopback `
            --passphrase $env:LEGACY_EXE_GPG_PASSPHRASE `
            --output $path --decrypt $encrypted
          if ($LASTEXITCODE -ne 0) {
            throw "GnuPG failed to decrypt the compiled legacy executable (exit code $LASTEXITCODE)."
          }

          $actual = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
          $expected = '5492198ce403d796c8588b17419bce82a0e6de3961bb40896a875ee5dee359ea'
          if ($actual -ne $expected) {
            throw "Compiled legacy executable SHA-256 mismatch. Expected $expected, actual $actual."
          }
          "path=$path" >> $env:GITHUB_OUTPUT
          Write-Host "Verified compiled hotkeySKG.exe SHA-256: $actual"

      - name: Decrypt pinned legacy AHK source
        id: source
        shell: powershell
        env:
          LEGACY_EXE_GPG_PASSPHRASE: ${{ secrets.LEGACY_EXE_GPG_PASSPHRASE }}
        run: |
          $ErrorActionPreference = 'Stop'
          $encrypted = Join-Path $PWD 'tests\legacy-binary\hotkeySKG.ahk.gpg.asc'
          $path = Join-Path $env:RUNNER_TEMP 'hotkeySKG.ahk'
          & '${{ steps.gpg.outputs.path }}' `
            --batch --yes --pinentry-mode loopback `
            --passphrase $env:LEGACY_EXE_GPG_PASSPHRASE `
            --output $path --decrypt $encrypted
          if ($LASTEXITCODE -ne 0) {
            throw "GnuPG failed to decrypt the legacy AHK source (exit code $LASTEXITCODE)."
          }

          $actual = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
          $expected = 'fde46d179a2cfb8123a314d4ea6b8de714a65302867d4b3a654af07f9472bab7'
          if ($actual -ne $expected) {
            throw "Legacy AHK source SHA-256 mismatch. Expected $expected, actual $actual."
          }
          "path=$path" >> $env:GITHUB_OUTPUT
          Write-Host "Verified hotkeySKG.ahk SHA-256: $actual"

      - name: Generate compatibility inventory
        shell: powershell
        env:
          IKEYD_LEGACY_AHK: ${{ steps.source.outputs.path }}
        run: |
          $ErrorActionPreference = 'Stop'
          $outputDir = Join-Path $PWD 'TestResults\compatibility-inventory'
          New-Item -ItemType Directory -Force -Path $outputDir | Out-Null
          $matrix = Join-Path $outputDir 'compatibility-matrix.json'
          $markdown = Join-Path $outputDir 'compatibility-matrix.md'
          python tools/analyze-legacy-compatibility.py $env:IKEYD_LEGACY_AHK `
            --coverage tests/compatibility/coverage-rules.json `
            --profile config/hotkeySKG.behavior.json `
            --scenarios tests/iKeyd.Compatibility.Tests/Scenarios `
            --json $matrix `
            --markdown $markdown

          python tools/apply-scenario-coverage.py `
            --matrix $matrix `
            --scenarios tests/iKeyd.Compatibility.Tests/Scenarios `
            --links tests/iKeyd.Compatibility.Tests/ScenarioInventoryLinks.json `
            --markdown $markdown

          python tools/validate-scenario-inventory-links.py `
            --matrix $matrix `
            --scenarios tests/iKeyd.Compatibility.Tests/Scenarios `
            --links tests/iKeyd.Compatibility.Tests/ScenarioInventoryLinks.json `
            --json (Join-Path $outputDir 'scenario-inventory-links.json') `
            --markdown (Join-Path $outputDir 'scenario-inventory-links.md')

          python tools/analyze-send-syntax.py `
            --matrix $matrix `
            --source $env:IKEYD_LEGACY_AHK `
            --json (Join-Path $outputDir 'send-syntax-inventory.json') `
            --markdown (Join-Path $outputDir 'send-syntax-inventory.md')

      - name: Download pinned AutoHotkey v1.1.16.05 interpreter
        id: ahk
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $url = 'https://raw.githubusercontent.com/2wayne/AutoHotkey_LPortable/2fca5b7f6b84e8c9574b78b01c101831068016e5/App/AutoHotkey/AutoHotkey.exe'
          $path = Join-Path $env:RUNNER_TEMP 'AutoHotkey-v1.1.16.05.exe'
          Invoke-WebRequest -Uri $url -OutFile $path -MaximumRedirection 10

          $length = (Get-Item -LiteralPath $path).Length
          if ($length -ne 910848) {
            throw "Unexpected AutoHotkey v1.1.16.05 interpreter size: $length."
          }
          $gitBlob = (& git hash-object $path).Trim().ToLowerInvariant()
          $expectedGitBlob = 'a776454e1eccfdcb92b7ab5214bca2832d52a1e8'
          if ($gitBlob -ne $expectedGitBlob) {
            throw "AutoHotkey interpreter Git blob mismatch. Expected $expectedGitBlob, actual $gitBlob."
          }

          $versionFile = Join-Path $env:RUNNER_TEMP 'ahk-version.txt'
          $probeFile = Join-Path $env:RUNNER_TEMP 'ahk-version-probe.ahk'
          @(
            "FileAppend, %A_AhkVersion%, $versionFile",
            'ExitApp'
          ) | Set-Content -LiteralPath $probeFile -Encoding ASCII
          $probe = Start-Process -FilePath $path -ArgumentList $probeFile -Wait -PassThru
          if ($probe.ExitCode -ne 0 -or -not (Test-Path -LiteralPath $versionFile)) {
            throw "AutoHotkey version probe failed with exit code $($probe.ExitCode)."
          }
          $runtimeVersion = (Get-Content -LiteralPath $versionFile -Raw).Trim()
          if ($runtimeVersion -ne '1.1.16.05') {
            throw "Unexpected AutoHotkey runtime version: $runtimeVersion."
          }

          $sha256 = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
          "path=$path" >> $env:GITHUB_OUTPUT
          "sha256=$sha256" >> $env:GITHUB_OUTPUT
          Write-Host "Verified AutoHotkey interpreter Git blob: $gitBlob"
          Write-Host "Verified AutoHotkey runtime version: $runtimeVersion"
          Write-Host "AutoHotkey interpreter SHA-256: $sha256"

      - name: Restore
        run: dotnet restore iKeyd.sln

      - name: Run compiled EXE differential
        shell: powershell
        env:
          IKEYD_LEGACY_EXE: ${{ steps.legacy.outputs.path }}
          IKEYD_LEGACY_EXE_SHA256: 5492198ce403d796c8588b17419bce82a0e6de3961bb40896a875ee5dee359ea
          IKEYD_DIFFERENTIAL_REPORT_DIR: ${{ github.workspace }}\TestResults\legacy-differential\compiled-exe
        run: |
          dotnet test tests/iKeyd.Windows.Tests/iKeyd.Windows.Tests.csproj `
            --no-restore `
            --configuration Release `
            --filter 'Category=HostedLegacyDifferentialE2E'

      - name: Run AHK v1 source differential
        shell: powershell
        env:
          IKEYD_AHK_V1_EXE: ${{ steps.ahk.outputs.path }}
          IKEYD_LEGACY_AHK: ${{ steps.source.outputs.path }}
          IKEYD_DIFFERENTIAL_REPORT_DIR: ${{ github.workspace }}\TestResults\legacy-differential\ahk-source
        run: |
          dotnet test tests/iKeyd.Windows.Tests/iKeyd.Windows.Tests.csproj `
            --no-restore `
            --configuration Release `
            --filter 'Category=HostedAhkSourceDifferentialE2E'

      - name: Upload differential reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: legacy-differential-reports
          path: TestResults/legacy-differential
          if-no-files-found: warn
          retention-days: 30

      - name: Upload compatibility inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compatibility-inventory
          path: TestResults/compatibility-inventory
          if-no-files-found: warn
          retention-days: 30
