name: Legacy differential

on:
  workflow_dispatch:
    inputs:
      legacy_exe_url:
        description: Public download URL for the pinned hotkeySKG.exe
        required: true
        type: string
      expected_sha256:
        description: Expected SHA-256 for hotkeySKG.exe
        required: true
        default: 5492198ce403d796c8588b17419bce82a0e6de3961bb40896a875ee5dee359ea
        type: string

permissions:
  contents: read

concurrency:
  group: legacy-differential
  cancel-in-progress: false

jobs:
  compare:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Prepare Japanese IME
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $basic = Get-WindowsCapability -Online |
            Where-Object { $_.Name -like 'Language.Basic~~~ja-JP~*' } |
            Select-Object -First 1

          if ($null -eq $basic) {
            throw 'Japanese Language.Basic capability was not found on this Windows runner.'
          }

          if ($basic.State -ne 'Installed') {
            Add-WindowsCapability -Online -Name $basic.Name
          }

          $languages = New-WinUserLanguageList 'ja-JP'
          $languages.Add('en-US')
          Set-WinUserLanguageList $languages -Force

          $ctfmon = Join-Path $env:WINDIR 'System32\ctfmon.exe'
          if (Test-Path $ctfmon) {
            Start-Process $ctfmon
          }

          Write-Host 'Installed language capabilities:'
          Get-WindowsCapability -Online |
            Where-Object { $_.Name -like 'Language.*~~~ja-JP~*' } |
            Format-Table Name, State
          Write-Host 'User language list:'
          Get-WinUserLanguageList | Format-List *

      - name: Download pinned legacy executable
        id: legacy
        shell: powershell
        env:
          LEGACY_EXE_URL: ${{ inputs.legacy_exe_url }}
          EXPECTED_SHA256: ${{ inputs.expected_sha256 }}
        run: |
          $ErrorActionPreference = 'Stop'
          $path = Join-Path $env:RUNNER_TEMP 'hotkeySKG.exe'

          Invoke-WebRequest -Uri $env:LEGACY_EXE_URL -OutFile $path -MaximumRedirection 10

          $actual = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
          $expected = $env:EXPECTED_SHA256.Trim().ToLowerInvariant()
          if ($actual -ne $expected) {
            throw "Legacy executable SHA-256 mismatch. Expected $expected, actual $actual."
          }

          "path=$path" >> $env:GITHUB_OUTPUT
          Write-Host "Verified hotkeySKG.exe SHA-256: $actual"

      - name: Restore
        run: dotnet restore iKeyd.sln

      - name: Run direct legacy differential
        shell: powershell
        env:
          EXPECTED_SHA256: ${{ inputs.expected_sha256 }}
        run: |
          .\tools\run-legacy-differential.ps1 `
            -LegacyExe '${{ steps.legacy.outputs.path }}' `
            -ExpectedSha256 $env:EXPECTED_SHA256 `
            -ReportDirectory (Join-Path $PWD 'TestResults\legacy-differential')

      - name: Upload differential reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: legacy-differential-reports
          path: TestResults/legacy-differential
          if-no-files-found: warn
          retention-days: 30
