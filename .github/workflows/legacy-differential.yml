name: Legacy differential

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - tests/legacy-binary/hotkeySKG.exe.gpg
      - .github/workflows/legacy-differential.yml
      - tests/iKeyd.Windows.Tests/HostedTModeLegacyRunner.cs
      - tests/iKeyd.Windows.Tests/HostedLegacyDifferentialTests.cs

permissions:
  contents: read

concurrency:
  group: legacy-differential-tmode
  cancel-in-progress: true

jobs:
  compare:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Decrypt pinned legacy executable
        id: legacy
        shell: powershell
        env:
          LEGACY_EXE_GPG_PASSPHRASE: ${{ secrets.LEGACY_EXE_GPG_PASSPHRASE }}
        run: |
          $ErrorActionPreference = 'Stop'

          if ([string]::IsNullOrWhiteSpace($env:LEGACY_EXE_GPG_PASSPHRASE)) {
            throw 'Repository secret LEGACY_EXE_GPG_PASSPHRASE is not configured.'
          }

          $encrypted = Join-Path $PWD 'tests\legacy-binary\hotkeySKG.exe.gpg'
          if (-not (Test-Path -LiteralPath $encrypted -PathType Leaf)) {
            throw "Encrypted legacy executable was not found: $encrypted"
          }

          $gpg = Join-Path $env:ProgramFiles 'Git\usr\bin\gpg.exe'
          if (-not (Test-Path -LiteralPath $gpg -PathType Leaf)) {
            $command = Get-Command gpg.exe -ErrorAction SilentlyContinue
            if ($null -eq $command) {
              throw 'GnuPG was not found in Git for Windows or PATH.'
            }
            $gpg = $command.Source
          }
          Write-Host "Using GnuPG: $gpg"

          $path = Join-Path $env:RUNNER_TEMP 'hotkeySKG.exe'
          & $gpg `
            --batch `
            --yes `
            --pinentry-mode loopback `
            --passphrase $env:LEGACY_EXE_GPG_PASSPHRASE `
            --output $path `
            --decrypt $encrypted

          if ($LASTEXITCODE -ne 0) {
            throw "GnuPG failed to decrypt the legacy executable (exit code $LASTEXITCODE)."
          }

          $actual = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
          $expected = '5492198ce403d796c8588b17419bce82a0e6de3961bb40896a875ee5dee359ea'
          if ($actual -ne $expected) {
            Remove-Item -LiteralPath $path -Force -ErrorAction SilentlyContinue
            throw "Legacy executable SHA-256 mismatch. Expected $expected, actual $actual."
          }

          "path=$path" >> $env:GITHUB_OUTPUT
          Write-Host "Verified hotkeySKG.exe SHA-256: $actual"

      - name: Restore
        run: dotnet restore iKeyd.sln

      - name: Run hosted direct legacy differential
        shell: powershell
        env:
          IKEYD_LEGACY_EXE: ${{ steps.legacy.outputs.path }}
          IKEYD_LEGACY_EXE_SHA256: 5492198ce403d796c8588b17419bce82a0e6de3961bb40896a875ee5dee359ea
          IKEYD_DIFFERENTIAL_REPORT_DIR: ${{ github.workspace }}\TestResults\legacy-differential
        run: |
          dotnet test tests/iKeyd.Windows.Tests/iKeyd.Windows.Tests.csproj `
            --no-restore `
            --configuration Release `
            --filter 'Category=HostedLegacyDifferentialE2E'

      - name: Upload differential reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: legacy-differential-reports
          path: TestResults/legacy-differential
          if-no-files-found: warn
          retention-days: 30
